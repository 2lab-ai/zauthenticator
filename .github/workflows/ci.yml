name: ci

# Runs on branch pushes and pull requests, and is called by release.yml before it publishes,
# so a release is verified by exactly these steps. Tag pushes are left to release.yml.
# Actions are pinned by commit SHA; the comment names the release tag the SHA was resolved from.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Trust gate
        run: npm run check

      - name: Trust gate self-test
        run: node scripts/check-policy.mjs --self-test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end (headed Chromium under xvfb)
        run: xvfb-run -a npm run e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
