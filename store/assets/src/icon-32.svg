<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- zauthenticator icon master for 32 px. 32-unit grid: the z's bars and sides sit on whole
       pixels and only its diagonal is anti-aliased. The countdown ring is simplified to a 2 px track and arc with
       whole-pixel edges at 12, 3, 6 and 9 o'clock, and the z is shrunk to fit inside it. Square
       black tile with a 1 px keyline of white at 30% on its outermost pixels (see icon.svg). -->
  <rect width="32" height="32" fill="#000000"/>
  <rect x="0.5" y="0.5" width="31" height="31" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="16" cy="16" r="12" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
  <path fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" d="M16 4A12 12 0 1 1 4 16"/>
  <path fill="#ffffff" d="M10 10L22 10L22 13L14.6 19L22 19L22 22L10 22L10 19L17.4 13L10 13Z"/>
</svg>
