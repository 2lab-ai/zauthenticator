<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- zauthenticator icon master for 16 px. 16-unit grid: the z's bars and sides sit on whole
       pixels and only its diagonal is anti-aliased. The countdown ring of icon.svg is left out at this size, where it would
       shrink the z below legibility. Square black tile with a 1 px keyline of white at 30% on its
       outermost pixels (see icon.svg). -->
  <rect width="16" height="16" fill="#000000"/>
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <path fill="#ffffff" d="M4 4L12 4L12 6L7.2 10L12 10L12 12L4 12L4 10L8.8 6L4 6Z"/>
</svg>
