<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- zauthenticator icon master (48 px and up). 96-unit grid: every horizontal and vertical edge
       of the z sits on an even unit, so it lands on whole pixels at 48 px (x0.5) and at 96 px of
       art in the 128 px icon (x1). Black and white: a square black tile (no corner radius, like
       the popup), a 2-unit keyline of white at 24% (the ring track's grey) just inside its edge,
       so the tile keeps its outline on a dark toolbar or a black page, and the white mark.
       Ring = TOTP countdown: faint track plus a 270 degree arc from 12 o'clock. -->
  <rect width="96" height="96" fill="#000000"/>
  <rect x="1" y="1" width="94" height="94" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="2"/>
  <circle cx="48" cy="48" r="29" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="6"/>
  <path fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" d="M48 19A29 29 0 1 1 19 48"/>
  <path fill="#ffffff" d="M34 34L62 34L62 40L43.6 56L62 56L62 62L34 62L34 56L52.4 40L34 40Z"/>
</svg>
