  <!-- zauthenticator icon master (48 px and up). 96-unit grid: every horizontal and vertical edge
       of the z sits on an even unit, so it lands on whole pixels at 48 px (x0.5) and at 96 px of
       art in the 128 px icon (x1). Squircle = superellipse |x|^5 + |y|^5 = 48^5 (about a 22%
       corner radius), filled with a #5e6ad2 to #4065d8 diagonal gradient; white on
       either stop is at least 4.5:1. Ring = TOTP countdown: faint track plus a 270 degree arc from 12 o'clock. -->
  <defs>
    <linearGradient id="zi-fill" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5e6ad2"/>
      <stop offset="1" stop-color="#4065d8"/>
    </linearGradient>
  </defs>
